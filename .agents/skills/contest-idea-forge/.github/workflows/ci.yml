name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Byte-compile
        run: python -m compileall contest_idea_forge
      - name: Import smoke test
        run: |
          python -c "import contest_idea_forge, contest_idea_forge.run, contest_idea_forge.analyze, contest_idea_forge.search_papers, contest_idea_forge.render; print('ok', contest_idea_forge.__version__)"
      - name: CLI help
        run: python -m contest_idea_forge.run --help
